version: "3.9"

services:
  ytmp3:
    build: .
    container_name: ytmp3-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DOWNLOAD_DIR=/tmp/ytmp3
    volumes:
      # Persist temp downloads across restarts (optional)
      - ytmp3_tmp:/tmp/ytmp3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ytmp3_tmp:
