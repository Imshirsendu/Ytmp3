name: ytmp3
description: Self-hosted YouTube to MP3 downloader and offline player.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.3
  uuid: ^4.4.0

  # ── Networking & Downloads ─────────────────────────────────────────────
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # ── File System ────────────────────────────────────────────────────────
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  # ── Audio Playback ─────────────────────────────────────────────────────
  just_audio: 0.10.6
  # audio_service removed — caused crash on Android 16
  audio_session: 0.2.4

  # ── Metadata ───────────────────────────────────────────────────────────
  id3tag: 0.2.0

  # ── State Management ───────────────────────────────────────────────────
  provider: ^6.1.2

  # ── UI Utilities ───────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  flutter_slidable: ^3.1.0
  share_plus: 10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
